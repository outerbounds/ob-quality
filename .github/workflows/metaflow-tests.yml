name: Metaflow QA

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - production
      flow:
        description: Repository-relative flow path, or "all"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: metaflow-qa-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality and discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            flows/requirements.txt
            flows/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r flows/requirements-dev.txt

      - name: Check formatting
        run: ruff format --check flows

      - name: Lint flows
        run: ruff check flows

      - name: Test flow utilities
        run: pytest

      - name: Validate flows and build matrix
        id: discover
        env:
          REQUESTED_FLOW: ${{ inputs.flow || 'all' }}
        run: |
          if [[ "$REQUESTED_FLOW" == "all" ]]; then
            matrix="$(python flows/scripts/check_flows.py --format json)"
          else
            matrix="$(python flows/scripts/check_flows.py --format json "$REQUESTED_FLOW")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  run-flow:
    name: Run ${{ matrix.flow }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.quality.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flows/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r flows/requirements.txt

      - name: Configure Outerbounds access
        env:
          OBP_MACHINE_USER: ${{ vars.OBP_MACHINE_USER }}
          OBP_DEPLOYMENT_DOMAIN: ${{ vars.OBP_DEPLOYMENT_DOMAIN }}
          OBP_PERIMETER: ${{ vars.OBP_PERIMETER }}
        run: |
          outerbounds service-principal-configure \
            --name "$OBP_MACHINE_USER" \
            --deployment-domain "$OBP_DEPLOYMENT_DOMAIN" \
            --perimeter "$OBP_PERIMETER" \
            --github-actions

      - name: Check Outerbounds connectivity
        run: outerbounds check -v

      - name: Run flow on Kubernetes
        env:
          FLOW_PATH: ${{ matrix.flow }}
        run: |
          mkdir -p flow-logs
          set -o pipefail
          python "$FLOW_PATH" --environment=fast-bakery run --with kubernetes \
            2>&1 | tee "flow-logs/$(basename "$FLOW_PATH" .py).log"

      - name: Add job summary
        if: always()
        env:
          FLOW_PATH: ${{ matrix.flow }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          echo "### Metaflow QA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: $TARGET_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow: $FLOW_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload flow log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metaflow-${{ inputs.environment || 'dev' }}-${{ strategy.job-index }}
          path: flow-logs/
          if-no-files-found: warn
          retention-days: 14
