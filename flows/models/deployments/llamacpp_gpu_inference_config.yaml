name: mc-llamacpp-gpu-app
port: 8000

environment:
  MODEL_NAME: Qwen/Qwen2.5-0.5B-Instruct
  MODEL_QUANT: q8_0

commands:
  - 'MODEL_PATH=$(outerbounds mc pull -m $MODEL_NAME --quant $MODEL_QUANT --format gguf -o /tmp/model-downloads)'
  - 'llama-server -m "$MODEL_PATH" -c 0 --host 0.0.0.0 --port "${PORT:-8000}"'

image: 006988687827.dkr.ecr.us-west-2.amazonaws.com/anaconda-llamacpp:latest

auth:
  type: BrowserAndApi

resources:
  cpu: "3"
  memory: "12Gi"
  disk: "16Gi"
  gpu: "1"

compute_pools:
  # GPU compute pool for the dev-coldbrewcrew test environment.
  - coldbrewcrew-pool
