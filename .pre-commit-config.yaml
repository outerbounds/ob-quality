repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^flows/.*\.py$
      - id: ruff-format
        files: ^flows/.*\.py$

  - repo: local
    hooks:
      - id: check-flows
        name: Validate Metaflow definitions
        entry: python flows/scripts/check_flows.py
        language: python
        additional_dependencies:
          - outerbounds==0.12.44
        files: ^flows/.*\.py$

      - id: test-flow-tools
        name: Test flow utilities
        entry: pytest
        args: [flows/tests]
        language: python
        additional_dependencies:
          - pytest==9.1.1
          - pyyaml
        # Includes flows/requirements*.txt and this file so the pinned-version
        # consistency checks in flows/tests/test_tool_versions.py run whenever
        # a version changes, not only when a flows/*.py file is also staged.
        files: ^(flows/.*\.py|flows/requirements(-dev)?\.txt|\.pre-commit-config\.yaml)$
        pass_filenames: false
