repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^flows/.*\.py$
      - id: ruff-format
        files: ^flows/.*\.py$

  - repo: local
    hooks:
      - id: check-flows
        name: Validate Metaflow definitions
        entry: python flows/scripts/check_flows.py
        language: python
        additional_dependencies:
          - outerbounds==0.12.44
        files: ^flows/.*_flow\.py$

      - id: check-flow-inventory
        name: Validate Metaflow flow inventory
        entry: python flows/scripts/check_flows.py --discovery-only
        language: python
        always_run: true
        pass_filenames: false
        stages: [manual]

      - id: test-flow-tools
        name: Test flow utilities
        entry: pytest
        args: [flows/tests]
        language: python
        additional_dependencies:
          - pytest==9.1.1
          - pyyaml
        # Includes tool configuration so focused tests run whenever behavior or
        # a pinned version changes, not only when a flows/*.py file is staged.
        files: ^(flows/.*\.py|flows/requirements(-dev)?\.txt|\.pre-commit-config\.yaml|pyproject\.toml)$
        pass_filenames: false
